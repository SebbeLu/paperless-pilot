[project]
name = "paperless-pilot"
version = "0.1.0"
description = "Bearbeitet Paperless-ngx-Dokumente automatisch mit lokalen LLMs (Ollama)."
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
paperless-pilot = "paperless_pilot.__main__:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "testcontainers>=4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N", "S", "C4", "RET", "PL"]
# RUF001-003: deutsche Typografie (Gedankenstrich, Anführungszeichen) ist gewollt
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
timeout = 30
markers = [
    "integration: braucht Docker (testcontainers); läuft in der CI",
]

[tool.coverage.run]
source = ["paperless_pilot"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
